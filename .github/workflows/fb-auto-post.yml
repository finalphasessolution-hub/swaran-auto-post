Ab kya karega naya system?
Out of Stock Check: Har product ka link khol ke dekhega — Out of Stock, Sold Out, Notify Me likha hai toh skip
Add to Cart / Buy Now nahi hai toh skip — matlab maal khatam hai
In-Stock wala hi post hoga — Out of Stock wale ko posted list mein daal dega taki dubara check bhi na kare
Tera wala SAIRA NX Grey wala link ab auto-skip ho jayega — agli baar random mein se koi dusra in-stock wala uthayega
Abhi ke liye tere 2 nuksaan wale links (Red aur Pink) toh in-stock hain, wohi zyada post honge. Baaki saare Flipkart wale products jo tu flipkart_all_links.txt mein dalega, unka bhi stock check ho ke hi post hoga.

