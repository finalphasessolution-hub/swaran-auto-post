    if response.status_code != 200 or "data" not in data:
        raise RuntimeError(f"Could not retrieve Facebook Page token: {data}")
    for page in data["data"]:
        if str(page.get("id")) == PAGE_ID and page.get("access_token"):
            return page["access_token"]
    raise RuntimeError("Page ID was not found in /me/accounts or token lacks Page access.")


def get_og_image(product_url):
    try:
        response = requests.get(product_url, headers=HEADERS, timeout=20, allow_redirects=True)
        if response.status_code != 200 or not host_is_allowed(response.url):
            return None
        soup = BeautifulSoup(response.text, "html.parser")
        for tag in (soup.find("meta", property="og:image"), soup.find("meta", attrs={"name": "twitter:image"})):
            if tag and tag.get("content", "").strip().startswith("https://"):
                image_url = tag["content"].strip()
                if host_is_allowed(image_url):
                    return image_url
    except requests.RequestException as exc:
        print(f"Image lookup failed: {exc}")
    return None


def post_to_facebook(page_token, product, canonical_url):
    discount = int((1 - product["sale_price"] / product["mrp"]) * 100)
    caption = (
        f"{product['caption']}\n\n"
        f"Listed price: {product['price']} (MRP ₹{product['mrp']}) - {discount}% OFF\n"
        f"Rating shown in supplied data: {product['rating']}★ ({product['reviews']} reviews)\n"
        f"Delivery claim: {product['delivery']}\n\n"
        f"Shop: {product['link']}\n\n"
        f"DM for details. Please confirm current price and availability on the seller page.\n"
        f"{product['hashtags']}\n\n"
        f"Auto-posted {datetime.now().strftime('%d-%m-%Y %I:%M %p')}"
    )
    image_url = get_og_image(canonical_url) or get_og_image(product["link"])
    if image_url:
        endpoint = f"https://graph.facebook.com/{GRAPH_VERSION}/{PAGE_ID}/photos"
        payload = {"url": image_url, "caption": caption, "access_token": page_token}
    else:
        endpoint = f"https://graph.facebook.com/{GRAPH_VERSION}/{PAGE_ID}/feed"
        payload = {"message": caption, "link": product["link"], "access_token": page_token}
    response = requests.post(endpoint, data=payload, timeout=30)
    try:
        result = response.json()
    except ValueError:
        result = {"error": {"message": response.text[:500]}}
    if response.status_code >= 400 or "id" not in result:
        raise RuntimeError(f"Facebook rejected the post (HTTP {response.status_code}): {result}")
    return result["id"]


def main():
    history = load_history()
    seen_keys = set(history.get("legacy_keys", []))
    for entry in history.get("posted", []):
        if isinstance(entry, dict):
            seen_keys.update(product_keys({"link": entry.get("url", "")}, entry.get("canonical_url", "")))
            seen_keys.update("id:" + item for item in product_ids(entry.get("product_id", "")))
        elif isinstance(entry, str):
            seen_keys.update(product_keys({"link": entry}))

    candidates = [p for p in PRODUCTS if is_candidate(p)]
    random.shuffle(candidates)
    selected = None
    selected_page = None
    for product in candidates:
        page = verify_product_link(product)
        if not page:
            continue
        keys = product_keys(product, page["canonical_url"])
        if keys & seen_keys:
            print(f"SKIP duplicate product/link: {product['title']} ({product['link']})")
            continue
        selected, selected_page = product, page
        break

    if not selected:
        print("No new verified product available. Nothing posted; history was not reset.")
        return 0

    page_token = get_page_token()
    post_id = post_to_facebook(page_token, selected, selected_page["canonical_url"])

    # Record only after Facebook returned a post ID; preserve all previous history.
    history["posted"].append({
        "title": selected["title"],
        "url": selected["link"],
        "canonical_url": selected_page["canonical_url"],
        "product_id": sorted(product_ids(selected_page["canonical_url"]))[0]
            if product_ids(selected_page["canonical_url"]) else "",
        "post_id": post_id,
        "posted_at": datetime.now(timezone.utc).isoformat(),
    })
    history["legacy_keys"] = sorted(set(history.get("legacy_keys", [])) | product_keys(selected, selected_page["canonical_url"]))
    save_history(history)
    print(f"SUCCESS: Facebook post ID {post_id}; history saved to {POSTED_FILE}.")
    return 0


if __name__ == "__main__":
    try:
        sys.exit(main())
    except Exception as error:
        print(f"ERROR: {error}", file=sys.stderr)
        sys.exit(1)
