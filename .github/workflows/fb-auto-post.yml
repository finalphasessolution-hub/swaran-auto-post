name: auto-post
on:
  schedule:
    - cron: '0 * * * *'  # har 1 ghante
  workflow_dispatch:

jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Run Swaran Auto Post
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
        run: python fb_auto_post_cloud.py
