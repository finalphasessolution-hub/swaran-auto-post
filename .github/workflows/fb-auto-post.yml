4. GitHub Actions में ये settings रखें
fb-auto-post.yml में Python script चलाने वाले step में:

      - name: Run Swaran Auto Post
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          POSTED_FILE: posted_history.json
        run: python fb_auto_post_cloud.py

इसके बाद history commit करने वाला step रखें, ताकि अगली scheduled run में भी पुराने पोस्ट याद रहें। Repository में FB_USER_TOKEN और FB_PAGE_ID को Settings → Secrets and variables → Actions में सेट करें।

