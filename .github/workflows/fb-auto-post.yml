name: auto-post
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Run
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
        run: python fb_auto_post_cloud.py
      - name: Save history
        run: |
          git config user.name "bot"
          git config user.email "bot@swaran.com"
          git add posted_history.json
          git diff --cached --quiet || (git commit -m "Update history" && git push)
