ठीक है भाई, अब सीधे काम करते हैं। Swaran Collections auto-post bot में दो मुख्य चीज़ें ठीक करनी हैं:

Duplicate पोस्ट रोकना — पिछली पोस्ट का रिकॉर्ड अगली GitHub Actions run में भी उपलब्ध रहे।

History सेव होना सुनिश्चित करना — GitHub Actions को posted_history.json अपडेट करने की permission मिले और बदलाव वास्तव में push हो।

साथ ही, Google से प्रोडक्ट लिंक न मिलने पर bot को गलत या पुराने लिंक बार-बार पोस्ट नहीं करने चाहिए। मैं बिना फाइल जाँचे यह दावा नहीं करूँगा कि समस्या ठीक हो गई है।

Step 1 — GitHub workflow में permission ठीक करो
GitHub पर अपना repository खोलो:

Open Swaran Auto-Post Repository
फिर .github/workflows/auto-post.yml खोलकर Edit पर क्लिक करो। name: के नीचे यह जोड़ो:


permissions:
  contents: write

concurrency:
  group: swaran-auto-post
  cancel-in-progress: false

इससे workflow को repository contents लिखने की permission मिलेगी, बशर्ते repository की Actions settings भी इसकी अनुमति देती हों। यह अकेले history save होने की गारंटी नहीं है।

Step 2 — मुझे असली फाइलें भेजो
इन तीन फाइलों को खोलकर उनका पूरा content यहाँ paste करो:

