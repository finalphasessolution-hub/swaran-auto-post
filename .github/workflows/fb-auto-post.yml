def get_random_badhiya_product():
    posted = set()

    if os.path.exists(POSTED_FILE):
        try:
            with open(POSTED_FILE, "r", encoding="utf-8") as f:
                data = json.load(f)
                if isinstance(data, list):
                    posted = set(data)
        except (OSError, json.JSONDecodeError):
            print("Warning: history file read nahi hui.")

    valid = [p for p in PRODUCTS if is_badhiya(p)]

    # Same product link ko ek hi baar rakho
    unique = {}
    for p in valid:
        unique.setdefault(p["link"].rstrip("/"), p)

    available = [
        p for link, p in unique.items()
        if link not in posted
    ]

    if not available:
        print("Sabhi eligible products post ho chuke hain.")
        return None

    return random.choice(available)


